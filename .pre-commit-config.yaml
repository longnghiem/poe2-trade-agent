# Checks to be run on every `git commit`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix --exit-non-zero-on-fix
        language: unsupported
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format --exit-non-zero-on-format
        language: unsupported
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app
        language: unsupported
        files: ^backend/.*\.py$
        pass_filenames: false