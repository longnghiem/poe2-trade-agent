[project]
name = "app"
version = "0.1.0"
description = "API for saving Path of Exile 2 trade searches as templates"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1,<2.0.0",
    "fastapi[standard]>=0.141.1,<1.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=7.4.3,<10.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[tool.ruff]
target-version = "py314"
exclude = ["app/alembic"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors and warnings
    "F",       # pyflakes: unused imports and variables, undefined names
    "I",       # isort: sorted, grouped imports
    "B",       # flake8-bugbear: common bug patterns
    "C4",      # flake8-comprehensions: simpler list/dict building
    "UP",      # pyupgrade: use modern Python syntax
    "ARG001",  # unused function arguments
    "T201",    # no print(); use logging
]
ignore = [
    "E501",  # long lines: ruff format handles line length
    "B008",  # function calls in default arguments: FastAPI needs them, e.g. Depends()
    "W191",  # tabs in indentation: ruff format handles it
    "B904",  # raising HTTPException inside except without "from e" is fine
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
